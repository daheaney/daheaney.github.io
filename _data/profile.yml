short_bio: >-
  <p>
    I am Ph.D. candidate in the UC Berkeley Department of Chemistry working in the <a href="https://beacon.berkeley.edu/about/" target="_blank">BEACO<sub>2</sub>N Group</a> with Professor Ron Cohen.
    My research highlights CO<sub>2</sub> emissions in cities, with a focus on identifying emissions patterns throughout time using inverse modeling and our dense network of BEACO<sub>2</sub>N sensors.
    My interests include atmospheric chemistry, greenhouse gas emissions, and the intersection of climate science and policy.
  </p>
  <p>
    Outside of research I enjoy hiking, taking care of my plants, and playing soccer and ultimate frisbee.
  </p>

